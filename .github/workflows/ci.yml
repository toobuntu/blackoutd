name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build
        run: make

      - name: Verify binary
        run: |
          file build/blackoutd | grep --quiet Mach-O
          codesign --verify build/blackoutd

  lint-plist:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Generate and lint plist
        run: |
          make postinstall
          plutil -lint "$HOME/Library/LaunchAgents/$(make -s print-bundle-id).plist"

  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      # install Homebrew formulae we might need
      # llvm provides clang-format and clang-tidy
      - uses: Homebrew/actions/cache-homebrew-prefix@main
        with:
          install: llvm
          workflow-key: homebrew-llvm

      - name: Check clang-format
        run: |
          LLVM_MAX_VERSION="$(
            brew list --formula --versions |
              grep --extended-regexp '^llvm(@[0-9]+)?[[:space:]]' |
              sort --key=2 --version-sort |
              awk 'END{print $1}'
          )"
          LLVM_PREFIX="$(brew --prefix)/opt/${LLVM_MAX_VERSION}"
          find src \( -name '*.m' -o -name '*.h' \) -print0 | \
            xargs -0 "$LLVM_PREFIX/bin/clang-format" --style=file --dry-run --Werror

  lint-unicode:
    # CI backstop for the pre-commit hook in .githooks/pre-commit.
    # Detects CVE-2021-42574 (Trojan Source) plus enforces UTF-8 without BOM.
    # Rationale and codepoint coverage:
    # docs/decisions/0001-trojan-source-detection-strategy.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check for invisible Unicode characters and validate UTF-8 encoding
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib, unicodedata
          # Detection strategy mirrors Red Hat's RHSB-2021-007 Python script
          # (find_unicode_control2.py): default mode flags every character
          # in Unicode category Cf (Format). We extend that to include Cc
          # (Control) — except a TAB/LF/CR allowlist — to also catch C0 and
          # C1 control characters. This is automatically future-proof: new
          # invisible characters added to Cf or Cc in subsequent Unicode
          # revisions are caught when the runner's Python is updated.
          #
          # Cf covers: bidi controls, zero-width chars, variation selectors
          # (including extended/supplement), BOM, and any future invisible
          # formatting characters.
          # Cc covers: C0 (U+0000-U+001F) and C1 (U+0080-U+009F) controls.
          #
          # Per-file opt-out: a `bidi-allow: U+XXXX,U+YYYY` annotation
          # anywhere in the file declares which codepoints it is allowed
          # to contain. Reviewable in PR diff, grep-able. Mirrors the
          # pre-commit hook's behavior.
          ALLOWED = {0x09, 0x0A, 0x0D}  # TAB, LF, CR
          SKIP_DIRS = {'.git'}
          ALLOW_RE = re.compile(r'bidi-allow:\s*([U+0-9A-Fa-f,]+)')

          def parse_allow(text):
              m = ALLOW_RE.search(text)
              if not m:
                  return frozenset()
              cps = set()
              for token in m.group(1).split(','):
                  token = token.strip()
                  if token.startswith('U+'):
                      try:
                          cps.add(int(token[2:], 16))
                      except ValueError:
                          pass
              return frozenset(cps)

          def is_suspicious(ch, allow):
              cp = ord(ch)
              if cp in ALLOWED or cp in allow:
                  return False
              return unicodedata.category(ch) in ('Cf', 'Cc')

          bidi_failures = []
          utf8_failures = []
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if SKIP_DIRS & set(path.parts):
                  continue
              try:
                  with path.open('rb') as fh:
                      head = fh.read(4096)
                      if b'\x00' in head:
                          # Single NUL alone does not prove "binary": UTF-16
                          # and UTF-32 text contain NULs but are still text
                          # files we want to reject under the UTF-8 policy.
                          for enc in ('utf-16', 'utf-32'):
                              try:
                                  head.decode(enc)
                              except UnicodeDecodeError:
                                  continue
                              utf8_failures.append(f'{path} (looks like {enc}; project requires UTF-8)')
                              break
                          continue
                      raw = head + fh.read()
              except OSError:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  utf8_failures.append(str(path))
                  continue
              allow = parse_allow(text)
              if any(is_suspicious(c, allow) for c in text):
                  bidi_failures.append(str(path))
          ok = True
          if utf8_failures:
              print('Files violating UTF-8-without-BOM policy:', file=sys.stderr)
              for f in utf8_failures:
                  print(f'  {f}', file=sys.stderr)
              ok = False
          if bidi_failures:
              print('Invisible Unicode characters found (CVE-2021-42574):', file=sys.stderr)
              for f in bidi_failures:
                  print(f'  {f}', file=sys.stderr)
              print('', file=sys.stderr)
              print('A file may opt out of specific codepoints with an in-file', file=sys.stderr)
              print('annotation, e.g.:  // bidi-allow: U+200E,U+200F', file=sys.stderr)
              ok = False
          if not ok:
              sys.exit(1)
          EOF

  lint-reuse:
    # Verifies REUSE 3.0 compliance: every file has a recognized SPDX
    # license expression (either inline as a comment, or via a sidecar
    # .license file, or via .reuse/dep5 / REUSE.toml). This is the gate
    # that should have caught the missing SPDX headers Copilot flagged
    # in PR#9 — previously the project ran `reuse lint` only in the
    # pre-commit hook, which contributors can bypass with `--no-verify`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # PIN-PENDING: pinact will replace the @v6 ref with a SHA + comment
      # the next time `pinact run --verify --update` is invoked. The v6
      # major-version pin tracks the latest reuse-tool 6.x release; do not
      # downgrade.
      - name: Run reuse lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  lint-tidy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      # install Homebrew formulae we might need
      # llvm provides clang-format and clang-tidy
      - uses: Homebrew/actions/cache-homebrew-prefix@main
        with:
          install: llvm
          workflow-key: homebrew-llvm
          uninstall: true

      - name: Locate clang-tidy
        run: |
          LLVM_MAX_VERSION="$(
            brew list --formula --versions |
              grep --extended-regexp '^llvm(@[0-9]+)?[[:space:]]' |
              sort --key=2 --version-sort |
              awk 'END{print $1}'
          )"
          LLVM_PREFIX="$(brew --prefix)/opt/${LLVM_MAX_VERSION}"
          if [ -n "$LLVM_PREFIX" ] && [ -x "$LLVM_PREFIX/bin/clang-tidy" ]; then
            echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          elif command -v clang-tidy >/dev/null 2>&1; then
            : # already on PATH
          else
            echo "::warning::clang-tidy not found; skipping lint-tidy"
            echo "SKIP_TIDY=1" >> "$GITHUB_ENV"
          fi

      - name: Run clang-tidy
        if: env.SKIP_TIDY != '1'
        run: |
          clang-tidy src/*.m -- \
            -fobjc-arc \
            -DBD_BUNDLE_ID='"io.github.toobuntu.blackoutd"' \
            -DBD_RESOURCES_BUNDLE='"/usr/local/share/blackoutd.bundle"' \
            -framework Cocoa \
            -framework CoreGraphics \
            -framework IOKit \
            -I src

  spec:
    # Behavioral tests for the pre-commit hook and CI Unicode scanner.
    # macOS runner so /bin/sh and BSD grep match what developers use.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec
