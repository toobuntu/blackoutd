name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build
        run: make

      - name: Verify binary
        run: |
          file build/blackoutd | grep --quiet Mach-O
          codesign --verify build/blackoutd

  lint-plist:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Generate and lint plist
        run: |
          make postinstall
          plutil -lint "$HOME/Library/LaunchAgents/$(make -s print-bundle-id).plist"

  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      # install Homebrew formulae we might need
      # llvm provides clang-format and clang-tidy
      - uses: Homebrew/actions/cache-homebrew-prefix@main
        with:
          install: llvm
          workflow-key: homebrew-llvm

      - name: Check clang-format
        run: |
          LLVM_MAX_VERSION="$(
            brew list --formula --versions |
              grep --extended-regexp '^llvm(@[0-9]+)?[[:space:]]' |
              sort --key=2 --version-sort |
              awk 'END{print $1}'
          )"
          LLVM_PREFIX="$(brew --prefix)/opt/${LLVM_MAX_VERSION}"
          find src \( -name '*.m' -o -name '*.h' \) -print0 | \
            xargs -0 "$LLVM_PREFIX/bin/clang-format" --style=file --dry-run --Werror

  lint-unicode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check for invisible Unicode characters
        run: |
          python3 - <<'EOF'
          import sys, pathlib
          BAD = (
              set(range(0x202A, 0x202F)) |
              set(range(0x2066, 0x206A)) |
              {0x200B, 0x200C, 0x200D, 0x200F, 0xFEFF}
          )
          SKIP_DIRS = {'.git'}
          failures = []
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if SKIP_DIRS & set(path.parts):
                  continue
              try:
                  text = path.read_bytes().decode('utf-8', errors='replace')
                  if any(ord(c) in BAD for c in text):
                      failures.append(str(path))
              except Exception:
                  pass
          if failures:
              print('Invisible Unicode characters found:', file=sys.stderr)
              for f in failures:
                  print(f'  {f}', file=sys.stderr)
              sys.exit(1)
          EOF

  lint-tidy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      # install Homebrew formulae we might need
      # llvm provides clang-format and clang-tidy
      - uses: Homebrew/actions/cache-homebrew-prefix@main
        with:
          install: llvm
          workflow-key: homebrew-llvm
          uninstall: true

      - name: Locate clang-tidy
        run: |
          LLVM_MAX_VERSION="$(
            brew list --formula --versions |
              grep --extended-regexp '^llvm(@[0-9]+)?[[:space:]]' |
              sort --key=2 --version-sort |
              awk 'END{print $1}'
          )"
          LLVM_PREFIX="$(brew --prefix)/opt/${LLVM_MAX_VERSION}"
          if [ -n "$LLVM_PREFIX" ] && [ -x "$LLVM_PREFIX/bin/clang-tidy" ]; then
            echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          elif command -v clang-tidy >/dev/null 2>&1; then
            : # already on PATH
          else
            echo "::warning::clang-tidy not found; skipping lint-tidy"
            echo "SKIP_TIDY=1" >> "$GITHUB_ENV"
          fi

      - name: Run clang-tidy
        if: env.SKIP_TIDY != '1'
        run: |
          clang-tidy src/*.m -- \
            -fobjc-arc \
            -DBD_BUNDLE_ID='"io.github.toobuntu.blackoutd"' \
            -DBD_RESOURCES_BUNDLE='"/usr/local/share/blackoutd.bundle"' \
            -framework Cocoa \
            -framework CoreGraphics \
            -framework IOKit \
            -I src
