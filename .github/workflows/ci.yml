name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: make

      - name: Verify binary
        run: |
          file build/blackoutd | grep --quiet Mach-O
          codesign --verify build/blackoutd

  lint-plist:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate and lint plist
        run: |
          make postinstall
          plutil -lint "$HOME/Library/LaunchAgents/$(make -s print-bundle-id).plist"

  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      # install Homebrew formulae we might need
      # llvm provides clang-format and clang-tidy
      - uses: Homebrew/actions/cache-homebrew-prefix@main
        with:
          install: llvm
          workflow-key: homebrew-llvm

      - name: Check clang-format
        run: |
          LLVM_MAX_VERSION="$(
            brew list --formula --versions |
              grep --extended-regexp '^llvm(@[0-9]+)?[[:space:]]' |
              sort --key=2 --version-sort |
              awk 'END{print $1}'
          )"
          LLVM_PREFIX="$(brew --prefix)/opt/${LLVM_MAX_VERSION}"
          find src \( -name '*.m' -o -name '*.h' \) -print0 | \
            xargs -0 "$LLVM_PREFIX/bin/clang-format" --style=file --dry-run --Werror

  lint-perms:
    # Single source of truth for the scope and check logic is
    # scripts/lint-perms.sh; .githooks/pre-commit invokes the same
    # script with --staged. Catches the regression that was fixed
    # manually in commit c7eec89 ("Mark scripts/ shebang files as
    # executable") if it recurs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify execute bit on shipped scripts
        env:
          LINT_PERMS_FORMAT: ci
        run: |
          if [ ! -x ./scripts/lint-perms.sh ]; then
            echo "::error file=scripts/lint-perms.sh::missing or not executable in the checkout"
            exit 1
          fi
          ./scripts/lint-perms.sh --tracked

  lint-unicode:
    # CI backstop for the pre-commit hook in .githooks/pre-commit.
    # Detects CVE-2021-42574 (Trojan Source) plus enforces UTF-8 without BOM.
    # Rationale and codepoint coverage:
    # docs/decisions/0001-trojan-source-detection-strategy.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for invisible Unicode characters and validate UTF-8 encoding
        # Single source of truth for the scan logic is scripts/lint-unicode.sh
        # (python3 here; the same script is what `make lint` runs locally, and
        # .githooks/pre-commit applies the same policy to staged blobs).
        run: scripts/lint-unicode.sh

  lint-reuse:
    # Verifies REUSE 3.0 compliance: every file has a recognized SPDX
    # license expression (either inline as a comment, or via a sidecar
    # .license file, or via .reuse/dep5 / REUSE.toml). This is the gate
    # that should have caught the missing SPDX headers Copilot flagged
    # in PR#9 — previously the project ran `reuse lint` only in the
    # pre-commit hook, which contributors can bypass with `--no-verify`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PIN-PENDING: pinact will replace the @v6 ref with a SHA + comment
      # the next time `pinact run --verify --update` is invoked. The v6
      # major-version pin tracks the latest reuse-tool 6.x release; do not
      # downgrade.
      - name: Run reuse lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  lint-adrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install adrs
        run: /home/linuxbrew/.linuxbrew/bin/brew install adrs
        # run: cargo install adrs

      - name: Run adrs doctor
        run: /home/linuxbrew/.linuxbrew/bin/adrs doctor

  lint-tidy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      # install Homebrew formulae we might need
      # llvm provides clang-format and clang-tidy
      - uses: Homebrew/actions/cache-homebrew-prefix@main
        with:
          install: llvm
          workflow-key: homebrew-llvm
          uninstall: true

      - name: Locate clang-tidy
        run: |
          LLVM_MAX_VERSION="$(
            brew list --formula --versions |
              grep --extended-regexp '^llvm(@[0-9]+)?[[:space:]]' |
              sort --key=2 --version-sort |
              awk 'END{print $1}'
          )"
          LLVM_PREFIX="$(brew --prefix)/opt/${LLVM_MAX_VERSION}"
          if [ -n "$LLVM_PREFIX" ] && [ -x "$LLVM_PREFIX/bin/clang-tidy" ]; then
            echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          elif command -v clang-tidy >/dev/null 2>&1; then
            : # already on PATH
          else
            echo "::warning::clang-tidy not found; skipping lint-tidy"
            echo "SKIP_TIDY=1" >> "$GITHUB_ENV"
          fi

      - name: Run clang-tidy
        if: env.SKIP_TIDY != '1'
        run: |
          clang-tidy src/*.m -- \
            -fobjc-arc \
            -DBD_BUNDLE_ID='"io.github.toobuntu.blackoutd"' \
            -DBD_RESOURCES_BUNDLE='"/usr/local/share/blackoutd.bundle"' \
            -framework Cocoa \
            -framework CoreGraphics \
            -framework IOKit \
            -I src

  spec:
    # Behavioral tests for the pre-commit hook and CI Unicode scanner.
    # macOS so /bin/sh (bash --posix) and BSD grep match what the hook
    # runs under on contributors' machines. Portable Ruby is the same
    # Ruby `brew ruby` uses locally (see `make test`), so local and CI
    # share one test toolchain.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew portable Ruby
        uses: Homebrew/actions/setup-ruby@main
        with:
          portable-ruby: true
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec
