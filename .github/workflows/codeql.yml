name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze (actions)
    if: github.repository_owner == 'toobuntu'
    runs-on: ubuntu-latest
    concurrency:
      group: "codeql-${{ github.ref }}"
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      security-events: write
      packages: read
    # Note: Objective-C is not supported by CodeQL (removed in
    # github/codeql#14923).  Only GitHub Actions workflow scanning
    # remains.  clang-tidy in the CI workflow provides the static
    # analysis coverage for the Objective-C source.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:actions"
