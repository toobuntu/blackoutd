name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze (actions)
    if: github.repository_owner == 'toobuntu'
    runs-on: ubuntu-latest
    concurrency:
      group: "codeql-${{ github.ref }}"
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      security-events: write
      packages: read
    # Note: Objective-C is not supported by CodeQL (removed in
    # github/codeql#14923).  Only GitHub Actions workflow scanning
    # remains.  clang-tidy in the CI workflow provides the static
    # analysis coverage for the Objective-C source.
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:actions"
