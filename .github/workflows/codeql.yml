name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze (actions)
    if: github.repository_owner == 'toobuntu'
    runs-on: ubuntu-latest
    concurrency:
      group: "codeql-${{ github.ref }}"
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      security-events: write
      packages: read
    # Note: Objective-C is not supported by CodeQL (removed in
    # github/codeql#14923).  Only GitHub Actions workflow scanning
    # remains.  clang-tidy in the CI workflow provides the static
    # analysis coverage for the Objective-C source.
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:actions"
